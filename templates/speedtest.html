<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
	<meta name="description"
		content="This Speed Typing Test frontend by BilalCodeTM" />
		
	<!-- Tab title -->
	<title>Typing Test</title>

	<!-- Frontend libraries -->
	<!--Bootstrap 4 -->
	<link rel="stylesheet" href="{{ url_for('static', filename='libs/bootstrap.min.css') }}">
	<!-- Fonts -->
	<link
		href="{{ url_for('static', filename='libs/google_fonts.css') }}"
		rel="stylesheet">
	<!-- fontawesome -->
	<link rel="stylesheet" href="{{ url_for('static', filename='libs/fa.css') }}">

	<!-- Static files -->
	<link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}">
	<link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">

</head>

<body>
	<div class="container-fluid box ">
		<!-- Top options -->
		<div class="top">
			
			<a class="current" href="{{ url_for('home') }}">
				<h1 id="heading" class="yellow">Typing Speed Test</h1>
			</a>
			<div class="limits-box">
				<div class="limit">
					<a id="thirty" class="yellow" href="#">30s</a>
					<a id="sixty" href="#">60s</a>
				</div>
				<div class="limit">
					<a id="beg" class="yellow" href="#">beginner</a>
					<a id="pro" href="#">pro</a>
				</div>

			</div>
		</div>

		<!-- Stats area -->
		<div class="stats center">
			<div class="stat-block if">
				<div id="timeName" class="stat-name yellow if">TIME</div>
				<div id="time" class="details if ">30</div>
			</div>

			<div class="stat-block if">
				<div id="cwName" class="stat-name yellow if">CORRECT WORDS</div>
				<div id="cw" class="details if">0</div>
			</div>
		</div>


		<!-- Words Display area -->
		<div class="text-display" id="textDisplay">

		</div>

		<!-- User input area -->
		<div class="input-area center">
			<textarea rows="1" class="text-input" id="textInput" autofocus autocomplete="off" autocorrect="off"
				autocapitalize="off" spellcheck="false" autofocus></textarea>
		</div>

		<!-- Test restart button -->
		<div class="restart-button center">
			<a id="restartBtn" class="current" href="#">
				<i class="fas fa-redo"></i>
			</a>
			<!-- <a class="p-1 ml-2" href="{{ url_for('home') }}"
				style="background-color: #ffd369; color: black; border-radius: 4px;">
				Home
			</a> -->
		</div>


		<footer class="center">2025 © 
			<a class="grey"
				target="_blank"
				href="https://github.com/syedbilalalam/">
				BilalCode<sup>TM</sup>
			</a>
		</footer>
	</div>

	<!-- App Javascript -->
	<!-- Wordlist file -->
	<script src="{{ url_for('static', filename='words.js') }}"></script>
	<!-- Frontend lgoic -->
	<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>

</html>
